name: Flutter platform builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows desktop build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: jobeval-windows
          path: frontend/build/windows/x64/runner/Release/

  android:
    name: Android APK build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jobeval-android-debug
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk

  web:
    name: Web release build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Upload Web bundle
        uses: actions/upload-artifact@v4
        with:
          name: jobeval-web
          path: frontend/build/web/
