[project]
name = "jobeval"
version = "0.1.0"
description = "JobEval — Intelligent CAD Analysis & CNC Cost Estimation Backend"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "JobEval Team", email = "team@jobeval.local"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",

    # Task queue
    "celery>=5.3.0",
    # "flower>=2.0.0",  # Celery monitoring — optional deployment dependency;
                        # install separately with: pip install flower (Python <3.12)

    # CAD/Geometry
    # "pythonocc-core>=7.7.0",  # Install separately via conda or build from source
    "build123d>=0.13.0",
    "ezdxf>=1.1.0",
    "trimesh>=4.0.0",
    "pygltflib>=1.16.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",

    # Drawing analysis
    "pymupdf>=1.23.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "paddleocr>=2.7.0",

    # File storage
    "minio>=7.2.0",

    # LLM
    "httpx>=0.26.0",
    "openai>=1.12.0",

    # Utilities
    "python-json-logger>=2.0.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
    "pendulum>=3.0.0",
    "uuid>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "ipython>=8.18.0",
]
cad = [
    "pythonocc-core>=7.7.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008"]
per-file-ignores = { "tests/*" = ["S101"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]