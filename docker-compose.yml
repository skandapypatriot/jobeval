# JobEval Development Docker Compose
# Run with: docker-compose -f docker-compose.yml up -d

version: '3.8'

services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: jobeval-postgres
    environment:
      POSTGRES_DB: jobeval
      POSTGRES_USER: jobeval
      POSTGRES_PASSWORD: jobeval
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobeval -d jobeval"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobeval-network
    restart: unless-stopped

  # =============================================================================
  # Redis (Cache + Celery Broker)
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: jobeval-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobeval-network
    restart: unless-stopped

  # =============================================================================
  # MinIO (S3-compatible object storage)
  # =============================================================================
  minio:
    image: minio/minio:latest
    container_name: jobeval-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - jobeval-network
    restart: unless-stopped

  # =============================================================================
  # Backend API
  # =============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: runtime
    container_name: jobeval-backend
    environment:
      - APP_NAME=JobEval
      - APP_VERSION=0.1.0
      - DEBUG=true
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://jobeval:jobeval@postgres:5432/jobeval
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - STORAGE_ENDPOINT=minio:9000
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - STORAGE_BUCKET=jobeval
      - STORAGE_SECURE=false
      - LLM_PROVIDER=nvidia_nim
      - LLM_BASE_URL=https://integrate.api.nvidia.com/v1
      - LLM_MODEL=nvidia/nemotron-3.5-...
      - PRIVACY_MODE=local
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=console
    volumes:
      - ./backend:/app:ro
      - uploads:/app/uploads
      - temp:/app/temp
      - outputs:/app/outputs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - jobeval-network
    restart: unless-stopped

  # =============================================================================
  # Celery Worker - CAD Processing
  # =============================================================================
  worker-cad:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: runtime
    container_name: jobeval-worker-cad
    command: celery -A app.core.celery_app worker -Q cad_processing -l INFO --concurrency=2
    environment:
      - DATABASE_URL=postgresql+asyncpg://jobeval:jobeval@postgres:5432/jobeval
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - STORAGE_ENDPOINT=minio:9000
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - STORAGE_BUCKET=jobeval
      - UPLOAD_DIR=/app/uploads
      - TEMP_DIR=/app/temp
      - OUTPUT_DIR=/app/outputs
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app:ro
      - uploads:/app/uploads
      - temp:/app/temp
      - outputs:/app/outputs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - jobeval-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  # =============================================================================
  # Celery Worker - Drawing Processing
  # =============================================================================
  worker-drawing:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: runtime
    container_name: jobeval-worker-drawing
    command: celery -A app.core.celery_app worker -Q drawing_processing -l INFO --concurrency=2
    environment:
      - DATABASE_URL=postgresql+asyncpg://jobeval:jobeval@postgres:5432/jobeval
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - STORAGE_ENDPOINT=minio:9000
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - STORAGE_BUCKET=jobeval
      - UPLOAD_DIR=/app/uploads
      - TEMP_DIR=/app/temp
      - OUTPUT_DIR=/app/outputs
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app:ro
      - uploads:/app/uploads
      - temp:/app/temp
      - outputs:/app/outputs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - jobeval-network
    restart: unless-stopped

  # =============================================================================
  # Celery Worker - Manufacturing Analysis
  # =============================================================================
  worker-manufacturing:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: runtime
    container_name: jobeval-worker-manufacturing
    command: celery -A app.core.celery_app worker -Q manufacturing -l INFO --concurrency=2
    environment:
      - DATABASE_URL=postgresql+asyncpg://jobeval:jobeval@postgres:5432/jobeval
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobeval-network
    restart: unless-stopped

  # =============================================================================
  # Celery Worker - LLM Tasks
  # =============================================================================
  worker-llm:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: runtime
    container_name: jobeval-worker-llm
    command: celery -A app.core.celery_app worker -Q llm -l INFO --concurrency=1
    environment:
      - DATABASE_URL=postgresql+asyncpg://jobeval:jobeval@postgres:5432/jobeval
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LLM_PROVIDER=nvidia_nim
      - LLM_API_KEY=${NVIDIA_API_KEY:-}
      - LLM_MODEL=nvidia/nemotron-3.5-...
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobeval-network
    restart: unless-stopped

  # =============================================================================
  # Flower (Celery Monitoring)
  # =============================================================================
  flower:
    image: mher/flower:2.0
    container_name: jobeval-flower
    command: celery -A app.core.celery_app flower --port=5555 --basic_auth=admin:admin
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jobeval-network
    restart: unless-stopped

  # =============================================================================
  # Frontend (Flutter Web)
  # =============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: production
    container_name: jobeval-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - jobeval-network
    restart: unless-stopped

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads:
  temp:
  outputs:

# =============================================================================
# Networks
# =============================================================================
networks:
  jobeval-network:
    driver: bridge