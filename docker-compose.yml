# Optional container profile. The primary local workflow runs the Python and
# Flutter sources directly and does not require Docker.
#
#   docker compose up --build
#   open http://localhost:3000

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      APP_NAME: JobEval
      APP_VERSION: 0.1.0
      ENVIRONMENT: container
      DEBUG: "false"
      DATABASE_URL: sqlite:////data/jobeval.db
      DATA_DIR: /data
      UPLOAD_DIR: /data/uploads
      OUTPUT_DIR: /data/reports
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      LOG_LEVEL: INFO
    volumes:
      - jobeval_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: production
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  jobeval_data:
